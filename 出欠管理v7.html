<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>誠心会拳法 浅井道場 出欠管理</title>
<style>
  :root {
    --navy:#1a2744;--red:#c0392b;--gold:#c9a84c;--bg:#f4f2ee;
    --white:#fff;--gray:#888;--light:#e8e4dc;
    --present:#27ae60;--absent:#e74c3c;--radius:12px;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{font-family:'Hiragino Kaku Gothic ProN',Meiryo,sans-serif;background:var(--bg);min-height:100vh}
  header{background:var(--navy);padding:14px 16px 10px;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.3)}
  .header-top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
  .logo{font-size:11px;color:var(--gold);letter-spacing:.05em;line-height:1.4}
  .logo strong{font-size:15px;display:block;color:#fff}
  .date-badge{margin-left:auto;background:rgba(255,255,255,.12);border:1px solid rgba(201,168,76,.4);border-radius:8px;padding:5px 10px;font-size:12px;color:var(--gold);white-space:nowrap}
  .branch-scroll{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
  .branch-scroll::-webkit-scrollbar{display:none}
  .branch-btn{flex-shrink:0;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:20px;color:rgba(255,255,255,.7);padding:5px 14px;font-size:13px;cursor:pointer;transition:all .2s}
  .branch-btn.active{background:var(--gold);border-color:var(--gold);color:var(--navy);font-weight:700}
  .class-tabs{display:flex;background:var(--white);border-bottom:2px solid var(--light);padding:0 16px;overflow-x:auto;scrollbar-width:none}
  .class-tabs::-webkit-scrollbar{display:none}
  .class-tab{padding:11px 18px;font-size:14px;font-weight:600;color:var(--gray);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap;transition:all .2s}
  .class-tab.active{color:var(--navy);border-bottom-color:var(--red)}
  .class-tab .count{display:inline-block;background:var(--light);border-radius:10px;font-size:11px;padding:1px 7px;margin-left:5px;font-weight:700;color:var(--navy)}
  .class-tab.active .count{background:var(--red);color:#fff}
  main{padding:12px 14px 100px}
  .summary{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:14px}
  .summary-card{background:var(--white);border-radius:var(--radius);padding:10px;text-align:center;box-shadow:0 1px 4px rgba(0,0,0,.08)}
  .summary-num{font-size:26px;font-weight:800;line-height:1}
  .summary-label{font-size:11px;color:var(--gray);margin-top:2px}
  .s-total .summary-num{color:var(--navy)}
  .s-present .summary-num{color:var(--present)}
  .s-absent .summary-num{color:var(--absent)}
  .bulk-row{display:flex;gap:8px;margin-bottom:12px}
  .bulk-btn{flex:1;padding:9px;border:none;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;transition:opacity .15s}
  .bulk-btn:active{opacity:.75}
  .bulk-present{background:var(--present);color:#fff}
  .bulk-absent{background:#f0f0f0;color:#555}
  .bulk-reset{background:#f0f0f0;color:#555}
  .student-grid{display:flex;flex-direction:column;gap:8px}
  .student-card{background:var(--white);border-radius:var(--radius);display:flex;align-items:center;padding:12px 14px;box-shadow:0 1px 4px rgba(0,0,0,.07);border-left:4px solid var(--light);transition:all .15s;cursor:pointer;user-select:none}
  .student-card.present{border-left-color:var(--present);background:#f0faf4}
  .student-card.absent{border-left-color:var(--absent);background:#fff5f5}
  .student-card:active{transform:scale(.98)}
  .student-info{flex:1}
  .student-name{font-size:16px;font-weight:700;color:var(--navy);letter-spacing:.02em}
  .student-sub{font-size:11px;color:var(--gray);margin-top:2px}
  .multi-badge{display:inline-block;background:#e8f0fe;color:#1a73e8;border-radius:4px;font-size:10px;padding:1px 5px;margin-left:4px;font-weight:700}
  .status-btn{width:52px;height:36px;border:none;border-radius:8px;font-size:18px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s}
  .status-btn.none{background:var(--light);color:var(--gray)}
  .status-btn.present{background:var(--present);color:#fff}
  .status-btn.absent{background:var(--absent);color:#fff}
  .empty{text-align:center;padding:60px 20px;color:var(--gray)}
  .submit-bar{position:fixed;bottom:0;left:0;right:0;background:var(--white);padding:12px 16px 20px;box-shadow:0 -2px 12px rgba(0,0,0,.1);display:flex;gap:10px;align-items:center}
  .admin-open-btn{background:rgba(26,39,68,.08);border:1px solid var(--light);border-radius:10px;padding:6px 10px;font-size:16px;cursor:pointer;flex-shrink:0}
  .submit-info{font-size:12px;color:var(--gray);flex:1}
  .submit-info strong{color:var(--navy);font-size:14px}
  .submit-btn{background:var(--navy);color:#fff;border:none;border-radius:10px;padding:12px 20px;font-size:14px;font-weight:700;cursor:pointer;white-space:nowrap}
  .submit-btn:disabled{background:var(--gray)}
  .modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;align-items:flex-end;justify-content:center}
  .modal-overlay.show{display:flex}
  .modal{background:var(--white);border-radius:20px 20px 0 0;padding:20px 20px 40px;width:100%;max-width:480px;animation:slideUp .25s ease}
  @keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
  .modal h3{font-size:16px;color:var(--navy);margin-bottom:16px;text-align:center}
  .modal-list{max-height:50vh;overflow-y:auto}
  .modal-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--light);font-size:14px}
  .modal-row:last-child{border-bottom:none}
  .modal-present{color:var(--present);font-weight:700}
  .modal-absent{color:var(--absent)}
  .modal-btns{display:flex;gap:10px;margin-top:16px}
  .modal-cancel{flex:1;padding:12px;border:2px solid var(--light);border-radius:10px;background:none;font-size:14px;cursor:pointer}
  .modal-confirm{flex:2;padding:12px;background:var(--navy);color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer}
  /* 管理画面 */
  .admin-overlay{display:none;position:fixed;inset:0;z-index:400;background:rgba(0,0,0,.45)}
  .admin-overlay.show{display:block}
  .admin-panel{position:absolute;bottom:0;left:0;right:0;background:var(--bg);border-radius:20px 20px 0 0;max-height:90vh;overflow-y:auto;padding:20px 16px 40px;animation:slideUp .25s ease}
  .admin-header{display:flex;align-items:center;margin-bottom:18px}
  .admin-header h2{font-size:17px;color:var(--navy);flex:1}
  .admin-close{background:var(--light);border:none;border-radius:50%;width:32px;height:32px;font-size:16px;cursor:pointer}
  .admin-section{margin-bottom:24px}
  .admin-section-title{font-size:13px;font-weight:700;color:var(--gray);letter-spacing:.05em;margin-bottom:10px}
  .admin-form{display:flex;flex-direction:column;gap:8px}
  .admin-input{width:100%;padding:10px 12px;border:1.5px solid var(--light);border-radius:8px;font-size:14px;background:var(--white);font-family:inherit}
  .admin-input:focus{outline:none;border-color:var(--navy)}
  .admin-add-btn{background:var(--navy);color:#fff;border:none;border-radius:8px;padding:11px;font-size:14px;font-weight:700;cursor:pointer}
  .admin-list{display:flex;flex-direction:column;gap:6px;margin-top:10px;max-height:45vh;overflow-y:auto}
  .admin-member-row{background:var(--white);border-radius:10px;padding:10px 12px;display:flex;align-items:center;gap:8px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
  .admin-member-info{flex:1}
  .admin-member-name{font-size:14px;font-weight:700;color:var(--navy)}
  .admin-member-sub{font-size:11px;color:var(--gray);margin-top:1px}
  .admin-edit-btn{background:var(--navy);color:#fff;border:none;border-radius:7px;padding:6px 10px;font-size:12px;cursor:pointer;white-space:nowrap}
  .admin-del-btn{background:var(--absent);color:#fff;border:none;border-radius:7px;padding:6px 10px;font-size:12px;cursor:pointer;white-space:nowrap}
  .edit-overlay{display:none;position:fixed;inset:0;z-index:500;background:rgba(0,0,0,.5);align-items:center;justify-content:center}
  .edit-overlay.show{display:flex}
  .edit-modal{background:var(--white);border-radius:16px;padding:24px 20px;width:calc(100% - 40px);max-width:400px;animation:slideUp .2s ease}
  .edit-modal h3{font-size:16px;color:var(--navy);margin-bottom:16px}
  .edit-row{margin-bottom:10px}
  .edit-row label{font-size:12px;color:var(--gray);display:block;margin-bottom:4px}
  .done-screen{display:none;position:fixed;inset:0;background:var(--navy);z-index:300;flex-direction:column;align-items:center;justify-content:center;color:#fff}
  .done-screen.show{display:flex}
  .done-icon{font-size:72px;margin-bottom:20px}
  .done-title{font-size:24px;font-weight:800;margin-bottom:8px}
  .done-sub{font-size:14px;color:rgba(255,255,255,.7);margin-bottom:32px;text-align:center}
  .done-close{background:var(--gold);color:var(--navy);border:none;border-radius:12px;padding:14px 36px;font-size:16px;font-weight:800;cursor:pointer}
</style>
</head>
<body>
<header>
  <div class="header-top">
    <div class="logo">誠心会拳法<br><strong>浅井道場 出欠管理</strong></div>
    <div class="date-badge" id="dateBadge"></div>
  </div>
  <div class="branch-scroll" id="branchScroll"></div>
</header>
<div class="class-tabs" id="classTabs"></div>
<main>
  <div class="summary">
    <div class="summary-card s-total"><div class="summary-num" id="sumTotal">0</div><div class="summary-label">総人数</div></div>
    <div class="summary-card s-present"><div class="summary-num" id="sumPresent">0</div><div class="summary-label">出席</div></div>
    <div class="summary-card s-absent"><div class="summary-num" id="sumAbsent">0</div><div class="summary-label">未確認</div></div>
  </div>
  <div class="bulk-row">
    <button class="bulk-btn bulk-present" onclick="bulkMark('present')">◯ 全員出席</button>
    <button class="bulk-btn bulk-absent" onclick="bulkMark('absent')">× 全員欠席</button>
    <button class="bulk-btn bulk-reset" onclick="bulkMark('none')">リセット</button>
  </div>
  <div class="student-grid" id="studentGrid"></div>
</main>
<div class="submit-bar">
  <button class="admin-open-btn" onclick="openAdmin()">⚙️<br><small>管理</small></button>
  <div class="submit-info"><strong id="submitInfo">支部・クラスを選択</strong><br>出席確認後に送信してください</div>
  <button class="submit-btn" id="submitBtn" onclick="showModal()" disabled>送信</button>
</div>
<!-- 確認モーダル -->
<div class="modal-overlay" id="modalOverlay" onclick="hideModal(event)">
  <div class="modal">
    <h3 id="modalTitle">出席確認</h3>
    <div class="modal-list" id="modalList"></div>
    <div class="modal-btns">
      <button class="modal-cancel" onclick="hideModal()">戻る</button>
      <button class="modal-confirm" onclick="submitRecord()">記録する</button>
    </div>
  </div>
</div>
<!-- 管理画面 -->
<div class="admin-overlay" id="adminOverlay">
  <div class="admin-panel">
    <div class="admin-header"><h2>⚙️ 会員管理</h2><button class="admin-close" onclick="closeAdmin()">✕</button></div>
    <div class="admin-section">
      <h3 class="admin-section-title">＋ 新規追加</h3>
      <div class="admin-form">
        <input class="admin-input" id="newId" type="number" placeholder="会員番号">
        <input class="admin-input" id="newName" type="text" placeholder="氏名（例：山田　太郎）">
        <select class="admin-input" id="newBranch"><option value="">支部を選択</option><option>佐織</option><option>名南</option><option>春日井</option><option>名和</option><option>大高</option><option>東海木曜</option><option>東海土曜</option></select>
        <select class="admin-input" id="newCls"><option value="">クラスを選択</option><option>1部</option><option>2部</option><option>3部</option><option>指導員</option><option>指導補</option></select>
        <button class="admin-add-btn" onclick="addMember()">追加する</button>
      </div>
    </div>
    <div class="admin-section">
      <h3 class="admin-section-title">✏️ 検索・編集・退会</h3>
      <input class="admin-input" id="searchInput" type="text" placeholder="名前または会員番号で検索" oninput="renderAdminList()">
      <div class="admin-list" id="adminList"></div>
    </div>
  </div>
</div>
<!-- 編集モーダル -->
<div class="edit-overlay" id="editOverlay" onclick="closeEdit(event)">
  <div class="edit-modal">
    <h3>会員情報の編集</h3>
    <input type="hidden" id="editOrigId">
    <div class="edit-row"><label>会員番号</label><input class="admin-input" id="editNum" type="text"></div>
    <div class="edit-row"><label>氏名</label><input class="admin-input" id="editName" type="text"></div>
    <div class="edit-row"><label>支部</label><select class="admin-input" id="editBranch"><option>佐織</option><option>名南</option><option>春日井</option><option>名和</option><option>大高</option><option>東海木曜</option><option>東海土曜</option></select></div>
    <div class="edit-row"><label>クラス</label><select class="admin-input" id="editCls"><option>1部</option><option>2部</option><option>3部</option><option>指導員</option><option>指導補</option></select></div>
    <div class="modal-btns" style="margin-top:16px">
      <button class="modal-cancel" onclick="closeEdit()">キャンセル</button>
      <button class="modal-confirm" onclick="saveMember()">保存する</button>
    </div>
  </div>
</div>
<!-- 完了画面 -->
<div class="done-screen" id="doneScreen">
  <div class="done-icon">✅</div>
  <div class="done-title">記録完了！</div>
  <div class="done-sub" id="doneSub"></div>
  <button class="done-close" onclick="closeDone()">次の稽古へ</button>
</div>

let members=[...BASE_MEMBERS];
let currentBranch='佐織';
let currentCls=null;
let status={};

const today=new Date();
document.getElementById('dateBadge').textContent=`${today.getFullYear()}年${today.getMonth()+1}月${today.getDate()}日`;

// 指定支部・クラスに表示すべき会員（複数クラス参加者含む）
function getFilteredMembers(branch,cls){
  const main=members.filter(m=>m.branch===branch&&m.cls===cls);
  const mainIds=new Set(main.map(m=>m.id));
  // 複数クラス参加者で、このbranch+clsに参加するが、メインが違う人
  const extra=[];
  for(const[id,list] of Object.entries(MULTI_CLASS)){
    if(mainIds.has(id)) continue;
    const match=list.some(([b,c])=>b===branch&&c===cls);
    if(!match) continue;
    const m=members.find(x=>x.id===id);
    if(m) extra.push(m);
  }
  return [...main,...extra];
}

function isMulti(id){return id in MULTI_CLASS;}

function getClasses(branch){
  const s=new Set(members.filter(m=>m.branch===branch).map(m=>m.cls));
  // 複数クラス参加者がこの支部に来る場合も追加
  for(const[id,list] of Object.entries(MULTI_CLASS)){
    for(const[b,c] of list){
      if(b===branch) s.add(c);
    }
  }
  return CLS_ORDER.filter(c=>s.has(c));
}

function renderBranches(){
  document.getElementById('branchScroll').innerHTML=BRANCHES.map(b=>
    `<button class="branch-btn ${b===currentBranch?'active':''}" onclick="selectBranch('${b}')">${b}</button>`
  ).join('');
}

function renderTabs(){
  const classes=getClasses(currentBranch);
  if(!currentCls||!classes.includes(currentCls)) currentCls=classes[0];
  document.getElementById('classTabs').innerHTML=classes.map(c=>{
    const cnt=getFilteredMembers(currentBranch,c).length;
    return `<div class="class-tab ${c===currentCls?'active':''}" onclick="selectClass('${c}')">${c}<span class="count">${cnt}</span></div>`;
  }).join('');
}

function renderStudents(){
  const filtered=getFilteredMembers(currentBranch,currentCls);
  const grid=document.getElementById('studentGrid');
  if(!filtered.length){grid.innerHTML='<div class="empty">🥋 該当する生徒がいません</div>';updateSummary();return;}
  const key=id=>`${currentBranch}:${currentCls}:${id}`;
  grid.innerHTML=filtered.map(m=>{
    const s=status[key(m.id)]||'none';
    const label=s==='present'?'○':s==='absent'?'×':'－';
    const multiBadge=isMulti(m.id)?'<span class="multi-badge">複数</span>':'';
    const sub=m.branch!==currentBranch?`${m.branch} ${m.cls}`:`${m.id}`;
    return `<div class="student-card ${s}" onclick="toggleStatus('${m.id}')">
      <div class="student-info">
        <div class="student-name">${m.name}${multiBadge}</div>
        <div class="student-sub">${sub}</div>
      </div>
      <div class="status-btn ${s}">${label}</div>
    </div>`;
  }).join('');
  updateSummary();
}

function updateSummary(){
  const filtered=getFilteredMembers(currentBranch,currentCls);
  const key=id=>`${currentBranch}:${currentCls}:${id}`;
  const present=filtered.filter(m=>(status[key(m.id)]||'none')==='present').length;
  const none=filtered.filter(m=>(status[key(m.id)]||'none')==='none').length;
  document.getElementById('sumTotal').textContent=filtered.length;
  document.getElementById('sumPresent').textContent=present;
  document.getElementById('sumAbsent').textContent=none;
  document.getElementById('submitInfo').innerHTML=`<strong>${currentBranch} ${currentCls}</strong><br>出席 ${present}名 / ${filtered.length}名`;
  document.getElementById('submitBtn').disabled=filtered.length===0;
}

function toggleStatus(id){
  const key=`${currentBranch}:${currentCls}:${id}`;
  const cur=status[key]||'none';
  status[key]=cur==='none'?'present':cur==='present'?'absent':'none';
  renderStudents();
}

function bulkMark(s){
  const filtered=getFilteredMembers(currentBranch,currentCls);
  const key=id=>`${currentBranch}:${currentCls}:${id}`;
  filtered.forEach(m=>{status[key(m.id)]=s;});
  renderStudents();
}

function selectBranch(b){currentBranch=b;currentCls=null;renderBranches();renderTabs();renderStudents();}
function selectClass(c){currentCls=c;renderTabs();renderStudents();}

function showModal(){
  const filtered=getFilteredMembers(currentBranch,currentCls);
  const key=id=>`${currentBranch}:${currentCls}:${id}`;
  const present=filtered.filter(m=>(status[key(m.id)]||'none')==='present');
  const none=filtered.filter(m=>(status[key(m.id)]||'none')==='none');
  document.getElementById('modalTitle').textContent=`${currentBranch} ${currentCls} — 出席確認`;
  document.getElementById('modalList').innerHTML=[
    ...present.map(m=>`<div class="modal-row"><span>${m.name}</span><span class="modal-present">○ 出席</span></div>`),
    ...none.map(m=>`<div class="modal-row"><span>${m.name}</span><span style="color:#aaa">－ 未確認</span></div>`),
  ].join('');
  document.getElementById('modalOverlay').classList.add('show');
}

function hideModal(e){
  if(!e||e.target===document.getElementById('modalOverlay'))
    document.getElementById('modalOverlay').classList.remove('show');
}

const GAS_URL='https://script.google.com/macros/s/AKfycby4C2dbvmxGzrV6z_Pv7V-ojbEk5KUaWOehqTgIOIhztVlcCajhpFOCVpxXEBbtTX-MHg/exec';

function submitRecord(){
  const filtered=getFilteredMembers(currentBranch,currentCls);
  const key=id=>`${currentBranch}:${currentCls}:${id}`;
  const present=filtered.filter(m=>(status[key(m.id)]||'none')==='present');
  hideModal();
  const dateStr=document.getElementById('dateBadge').textContent;

  if(present.length>0){
    const records=present.map(m=>{
      return {
        date: dateStr,
        branch: currentBranch,
        cls: currentCls,
        id: m.id,
        name: m.name,
        timestamp: new Date().toISOString()
      };
    });
    fetch(GAS_URL,{
      method:'POST',
      mode:'no-cors',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({records})
    }).catch(err=>console.error('送信エラー',err));
  }

  document.getElementById('doneSub').innerHTML=`${dateStr}<br>${currentBranch} ${currentCls}<br>出席 <strong style="color:#7be0a0">${present.length}名</strong> を記録しました`;
  document.getElementById('doneScreen').classList.add('show');
  filtered.forEach(m=>{delete status[key(m.id)];});
}

function closeDone(){document.getElementById('doneScreen').classList.remove('show');renderStudents();}

  const el=document.getElementById('adminList');
  if(!list.length){el.innerHTML='<div style="text-align:center;padding:20px;color:#aaa">該当なし</div>';return;}
  el.innerHTML=list.map(m=>`
    <div class="admin-member-row">
      <div class="admin-member-info">
        <div class="admin-member-name">${m.name}${isMulti(m.id)?'<span class="multi-badge">複数</span>':''}</div>
        <div class="admin-member-sub">${m.id} ／ ${m.branch} ／ ${m.cls}</div>
      </div>
      <button class="admin-edit-btn" onclick="openEdit('${m.id}')">編集</button>
      <button class="admin-del-btn" onclick="deleteMember('${m.id}')">退会</button>
    </div>`).join('');
}

function addMember(){
  const id=document.getElementById('newId').value.trim();
  const name=document.getElementById('newName').value.trim();
  const branch=document.getElementById('newBranch').value;
  const cls=document.getElementById('newCls').value;
  if(!id||!name||!branch||!cls){alert('すべての項目を入力してください');return;}
  if(members.find(m=>m.id===id)){alert('この会員番号はすでに登録されています');return;}
  members.push({id,name,branch,cls});
  document.getElementById('newId').value='';
  document.getElementById('newName').value='';
  document.getElementById('newBranch').value='';
  document.getElementById('newCls').value='';
  renderAdminList();
  alert(`${name} さんを追加しました`);
}

function openEdit(id){
  const m=members.find(m=>m.id===id);
  if(!m) return;
  document.getElementById('editOrigId').value=id;
  document.getElementById('editNum').value=m.id;
  document.getElementById('editName').value=m.name;
  document.getElementById('editBranch').value=m.branch;
  document.getElementById('editCls').value=m.cls;
  document.getElementById('editOverlay').classList.add('show');
}
function closeEdit(e){
  if(!e||e.target===document.getElementById('editOverlay'))
    document.getElementById('editOverlay').classList.remove('show');
}
function saveMember(){
  const origId=document.getElementById('editOrigId').value;
  const newNum=document.getElementById('editNum').value.trim();
  const newName=document.getElementById('editName').value.trim();
  const newBranch=document.getElementById('editBranch').value;
  const newCls=document.getElementById('editCls').value;
  if(!newNum||!newName){alert('会員番号と氏名は必須です');return;}
  const idx=members.findIndex(m=>m.id===origId);
  if(idx!==-1) members[idx]={id:newNum,name:newName,branch:newBranch,cls:newCls};
  closeEdit();
  renderAdminList();
  alert(`${newName} さんの情報を更新しました`);
}
function deleteMember(id){
  const m=members.find(m=>m.id===id);
  if(!m) return;
  if(!confirm(`${m.name} さんを退会処理しますか？\nこの操作は元に戻せません。`)) return;
  members=members.filter(x=>x.id!==id);
  renderAdminList();
}

renderBranches();renderTabs();renderStudents();
</script>
</body>
</html>
